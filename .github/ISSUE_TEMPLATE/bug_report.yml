name: Bug report
description: Report a reproducible problem with RepoManager.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve RepoManager. Do not include secrets, private repository content, or personal data.
        Undisclosed security vulnerabilities must not be reported through this public form. Use [GitHub Private Vulnerability Reporting](https://github.com/IcyShadow5/RepoManager/security/advisories/new) or the private email listed in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: Briefly describe the problem and when it occurs.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Start RepoManager...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RepoManager version or commit
      description: Provide the version or commit SHA if known.
      placeholder: "0.1.0 or commit SHA"
  - type: input
    id: windows_version
    attributes:
      label: Windows version
      description: Include the Windows version and build if known.
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: How are you running RepoManager?
      options:
        - Packaged application
        - From source
        - Not sure
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python version (source only)
      description: If running from source, provide the output of `py --version` or equivalent.
      placeholder: "Python 3.14.7"
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or screenshots
      description: Add only evidence needed to understand the problem. Remove secrets, credentials, tokens, private repository content, and sensitive personal data first.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other relevant details or safe workarounds.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched the existing issues for this problem.
          required: true
        - label: This report is not an undisclosed security vulnerability.
          required: true
        - label: I removed secrets, credentials, tokens, private repository content, and sensitive personal data.
          required: true
