name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Current Qt product / CPython 3.14.7
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Configure git for test repositories
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - name: Run current product gate (no legacy Tkinter UI)
        run: |
          python -I -m pip --isolated install --disable-pip-version-check --only-binary=:all: --require-hashes --index-url https://pypi.org/simple -r packaging/requirements-bootstrap.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -m pip --isolated install --disable-pip-version-check --only-binary=:all: --require-hashes --index-url https://pypi.org/simple -r packaging/requirements-qt.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tests.run_layers --layer current

  legacy-reference:
    name: Legacy parity reference (not current UI proof)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.7"
      - name: Configure git for test repositories
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - name: Run historical parity and maintenance references separately
        run: |
          python -B -m tests.run_layers --layer legacy
          python -B -m tests.run_layers --layer auxiliary
